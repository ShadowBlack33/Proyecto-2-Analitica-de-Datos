# ============================================================
# PENGWIN — configuracion central. Todo parametro ajustable vive aqui,
# nunca "quemado" en el codigo, para que el informe pueda citar valores exactos.
# ============================================================

seed: 42

rutas:
  imagenes: data/raw/images        # donde quedan los .mha de part1 + part2 juntos
  etiquetas: data/raw/labels       # donde quedan los .mha de PENGWIN_CT_train_labels
  cache: data/cache                # cortes preprocesados (.npy por caso, leidos con mmap)
  splits: data/splits.json
  checkpoints: checkpoints
  resultados: resultados

datos:
  resolucion: 256                  # enunciado: 224-256 px por corte
  contexto: 1                      # 2.5D: cortes vecinos a cada lado -> 2*1+1 = 3 canales
  ventana_hu: [-200, 1200]         # EDA: cubre el hueso completo (p1 -4 HU, p99 1154 HU)
  umbral_hueso_hu: 200             # para el MIP del visualizador 1 (muestra la corteza)
  frac_cortes_sin_hueso: 0.10      # % de cortes de fondo que se mantienen en entrenamiento
  split: [0.70, 0.15, 0.15]        # train / val / test, POR PACIENTE (nunca por corte)
  num_workers: 0                   # Windows con poca VRAM: 0 (recomendacion del curso)

aumentos:
  activar: true
  prob_degradacion: 0.5            # robustez a imagenes de baja calidad (pedido del profesor)
  ruido_sigma: [0.0, 0.08]
  blur_sigma: [0.0, 1.5]
  factor_submuestreo: [1.0, 3.0]
  gamma: [0.7, 1.5]
  rotacion_grados: 10
  flip_horizontal: false           # OJO: voltear intercambia coxal izq/der -> se hace con swap de etiquetas

modelo:
  canales: [32, 64, 128, 256, 512] # FundidoraPC extendida: 5 bloques
  convs_por_bloque: 1              # 1 = compatible con los pesos de la FundidoraPC de clase
  cbam_en_bloques: [4, 5]          # CBAM antes de bifurcar hacia las cabezas
  cbam_reduccion: 16
  canales_decoder: [256, 128, 64, 32, 32]
  pesos_backbone: null             # ruta .pth de una FundidoraPC entrenada (transfer learning)

deteccion:
  stride: 16                       # grid de 16x16 celdas con entrada 256
  radio_centro: 2.5                # center sampling (celdas) para asignar positivos
  umbral_score: 0.30
  umbral_nms: 0.50
  max_det_por_clase: 1             # taxonomia: 1 caja por region por corte

perdida:
  # lambdas calibrados con scripts/calibrar_lambdas.py (balance de normas de gradiente
  # sobre el backbone compartido, referencia lambda_sem = 1), redondeados:
  lambda_cls: 0.5                  # sugerido 0.38: su gradiente es 2.6x el de la referencia
  lambda_det_obj: 3.0              # sugerido 3.09
  lambda_det_box: 5.0              # sugerido 5.96: gradiente ~6x menor, mismo caso que la Semana 6
  lambda_sem: 1.0                  # referencia
  lambda_rol: 1.0                  # sugerido 0.88
  lambda_borde: 2.0                # sugerido 1.97; EDA: la mayoria de fragmentos estan en contacto
  lambda_dist: 0.5                 # sugerido 0.62
  focal_gamma: 2.0
  focal_alpha: 0.25
  borde_pos_weight: 10.0
  huber_delta: 0.5                 # sobre log(1+d_mm)

entrenamiento:
  batch_size: 16                   # perfil de memoria: 2.07 GB pico a 256 px, cabe en 4 GB
  acumulacion: 1                   # batch efectivo = batch_size * acumulacion
  amp: true                        # enunciado: precision mixta obligatoria
  lr: 0.001
  weight_decay: 0.0001
  clip_grad: 5.0
  fast_dev_run: false              # true = 2 batches por fase, para depurar en segundos
  metrica_mejor: val_score         # se guarda el mejor checkpoint por validacion, no el ultimo
  # curriculum: cada etapa activa cabezas y define si el backbone se congela
  etapas:
    - nombre: deteccion
      cabezas: [cls, det]
      epocas: 15
      congelar_backbone: false
    - nombre: segmentacion
      cabezas: [cls, det, seg]
      epocas: 20
      congelar_backbone: false
    - nombre: distancia
      cabezas: [cls, det, seg, dist]
      epocas: 10
      congelar_backbone: true
    - nombre: conjunto
      cabezas: [cls, det, seg, dist]
      epocas: 10
      congelar_backbone: false
      lr_factor: 0.1

postproceso:
  filtrar_con_clasificador: true   # la cabeza de clasificacion apaga regiones que "no estan" en el corte
  min_voxeles_fragmento: 200
  max_fragmentos_por_region: 10
  percentil_distancia: 0           # 0 = minimo exacto (borde a borde); 2-5 = mas robusto a ruido